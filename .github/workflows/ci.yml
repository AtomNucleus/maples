name: CI

on:
  push:
    branches: [main, feature/sunken-grove-vertical-slice]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
