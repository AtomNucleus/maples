name: Showcase validation (manual only)

# Project policy: do not spend GitHub Actions minutes for normal validation.
# Builds, movement tests, gameplay/visual regression tests, and browser validation
# are run outside GitHub Actions before handing off the Netlify Deploy Preview.
on:
  workflow_dispatch:

jobs:
  policy-note:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Automated PR validation is intentionally disabled; use local/Netlify validation instead."
